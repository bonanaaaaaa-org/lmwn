[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "0.1.0"
description = "API gateway aggregating the guide and restaurant services for the web app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "pyrefly>=0.40.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "ANN401", "E", "TID", "DTZ", "B", "UP"]
ignore = ["E501"]                    # Line too long - handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "No Any. Use precise types, a TypedDict/Pydantic model, or app.shared.types.JSONValue."
"typing_extensions.Any".msg = "No Any. Use precise types, a TypedDict/Pydantic model, or app.shared.types.JSONValue."

[tool.pyrefly]
python-version = "3.14"
python-interpreter-path = "../.venv/bin/python3"
search-path = ["."]
project-excludes = ["**/.venv", "**/__pycache__", "**/node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
include = ["app/*"]
fail_under = 90

[tool.setuptools.packages.find]
include = ["app*"]
