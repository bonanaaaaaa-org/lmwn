name: CI

# Every pull request (whatever its base branch, so stacked PRs are checked), every push to main,
# or by hand (Actions -> CI -> Run workflow). Runs on GitHub-hosted runners.
#
# Pull requests and manual runs: checks only, with no secrets and no cloud access (Verify, E2E,
# Infrastructure checks). The pr GCP project isn't billed, so nothing deploys from a pull request.
# A push to main also runs Deploy prod (environment: prod), which deploys infra/ to GCP
# (infra/README.md). Cloud access is only through workload identity federation; no cloud key is
# stored in GitHub.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Terraform for infra/: the version CI and the deploy use.
  TERRAFORM_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Turborepo: no anonymous usage telemetry from CI.
  TURBO_TELEMETRY_DISABLED: "1"
  # The provided data server's MongoDB binary is only needed by `pnpm dev`, never by these checks.
  MONGOMS_DISABLE_POSTINSTALL: "1"

# A newer push to the same PR cancels the run it supersedes. A running run on main is never
# cancelled, so a deploy never stops half-way. GitHub keeps one pending run per group, so a queued
# main run can still be replaced by a newer push; Deploy prod also stops if main has moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: true
          persist-credentials: false
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6.1.1
      # Node version from .nvmrc; pnpm store cached, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # uv for the api-gateway; Python comes from .python-version (uv downloads it). uv's cache is
      # keyed on uv.lock.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Tool versions
        run: |
          node --version
          pnpm --version
          uv --version
          uv run python --version
      # Each check below is a root script run through Turborepo (turbo.json), per package
      # (api-gateway, web).
      - name: Format (ruff format)
        run: pnpm run format:check
      - name: Lint (oxlint, stylelint, ruff)
        run: pnpm run lint
      - name: Type check (tsc with typed CSS modules, pyrefly)
        run: pnpm run type-check
      - name: Test (Vitest; pytest with 90% coverage minimum and the architecture test)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Build Storybook
        run: pnpm run build-storybook
      # Story tests render every story in headless Chromium and fail on any axe violation
      # (Storybook a11y addon, `a11y.test: "error"`).
      - name: Install Playwright Chromium (story tests)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Storybook tests (play functions + axe, WCAG 2.2 A and AA)
        run: pnpm run test:storybook

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This job runs the provided data server, so it needs its MongoDB binary.
      MONGOMS_DISABLE_POSTINSTALL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Playwright's webServer starts the whole stack (`pnpm dev`: data server, gateway, web).
      - name: E2E (Playwright + axe, desktop + mobile)
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  infra-check:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      # No backend and no credentials: validates the configuration and runs infra/tests with mock
      # providers (what prod plans).
      - name: terraform validate and test
        run: |
          terraform -chdir=infra init -backend=false -no-color
          terraform -chdir=infra validate -no-color
          terraform -chdir=infra test -no-color
      # shellcheck comes with the GitHub-hosted Ubuntu image.
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh

  deploy-prod:
    name: Deploy prod
    needs: [verify, e2e, infra-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only main may use prod's deploy identity and secrets (repo-management's deployment branch policy).
    environment:
      name: prod
      url: ${{ steps.urls.outputs.web_url }}
    # Deploys one at a time, never cancelled half-way.
    concurrency:
      group: prod-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      # API quota and billing go to the prod project, not to the management project that holds the
      # deploy identity: gcloud, the Firebase CLI and the Google client libraries.
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_BILLING_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_WORKSPACE_PREFIX: ${{ vars.TF_STATE_WORKSPACE_PREFIX }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      # This commit's images (scripts/build-images.sh pushes them; Terraform runs them).
      TF_VAR_gateway_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lmwn/api-gateway:${{ github.sha }}
      TF_VAR_data_server_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lmwn/data-server:${{ github.sha }}
    steps:
      # A run that waited in the concurrency group, or a re-run, must not roll an older commit over
      # a newer one.
      - name: Check that main is still at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::error title=Stale deploy stopped::main is at $head, not $GITHUB_SHA. Nothing was changed; the newer commit's run deploys it."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # Installs and the web build run before any credential exists in the job. The API domain
      # is the one in infra/env/prod.tfvars (deploy-hosting.sh checks the bundle against
      # Terraform's api_url output).
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (post-deploy tests)
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Build the web app against the API domain
        run: |
          set -euo pipefail
          api_domain=$(sed -n 's/^api_domain *= *"\(.*\)"$/\1/p' infra/env/prod.tfvars)
          [[ -n $api_domain ]] || { echo "::error::no api_domain in infra/env/prod.tfvars"; exit 1; }
          VITE_API_BASE_URL="https://$api_domain" pnpm turbo run build --filter=web
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      # Only the Terraform steps hold the R2 key pair (state) and the Cloudflare token (DNS records
      # of bonanaaaaaa.dev only).
      - name: Initialize Terraform against the R2 state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: infra/scripts/backend-init.sh infra
      - name: Make sure the image registry exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: infra/scripts/ensure-registry.sh infra env/prod.tfvars
      - name: Build and push the images
        run: infra/scripts/build-images.sh
      # Plans prod (the changes go to the job summary) and applies that saved plan.
      - name: terraform plan and apply (prod)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: infra/scripts/apply.sh infra env/prod.tfvars
      - name: Public URLs
        id: urls
        run: echo "web_url=$WEB_URL" >>"$GITHUB_OUTPUT"
      - name: Deploy the web app to Firebase Hosting
        run: infra/scripts/deploy-hosting.sh
      # The checks below need no cloud access: drop the credentials file before running them.
      - name: Remove the Google credentials
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS" gha-creds-*.json
      - name: Smoke-test the deploy
        run: infra/scripts/smoke-test.sh "$API_URL" "$WEB_URL"
      - name: E2E against the deployed site (Playwright + axe, desktop + mobile)
        run: PLAYWRIGHT_BASE_URL="$WEB_URL" API_BASE_URL="$API_URL" pnpm --filter e2e test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-prod
          path: e2e/playwright-report/
          retention-days: 7
