name: CI

# Every pull request (whatever its base branch, so stacked PRs are checked), every push to main,
# or by hand (Actions -> CI -> Run workflow). No secrets and no deploy. Runs on GitHub-hosted runners.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Turborepo: no anonymous usage telemetry from CI.
  TURBO_TELEMETRY_DISABLED: "1"
  # The provided data server's MongoDB binary is only needed by `pnpm dev`, never by these checks.
  MONGOMS_DISABLE_POSTINSTALL: "1"

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: true
          persist-credentials: false
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6.1.1
      # Node version from .nvmrc; pnpm store cached, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # uv for the api-gateway; Python comes from .python-version (uv downloads it). uv's cache is
      # keyed on uv.lock.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Tool versions
        run: |
          node --version
          pnpm --version
          uv --version
          uv run python --version
      # Each check below is a root script run through Turborepo (turbo.json), per package
      # (api-gateway, web).
      - name: Format (ruff format)
        run: pnpm run format:check
      - name: Lint (oxlint, stylelint, Thai copy guard, ruff)
        run: pnpm run lint
      - name: Type check (tsc with typed CSS modules, pyrefly)
        run: pnpm run type-check
      - name: Test (Vitest; node:test for repo and web scripts; pytest with 90% coverage minimum and the architecture test)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Build Storybook
        run: pnpm run build-storybook
      # Story tests render every story in headless Chromium and fail on any axe violation
      # (Storybook a11y addon, `a11y.test: "error"`).
      - name: Install Playwright Chromium (story tests)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Storybook tests (play functions + axe, WCAG 2.2 A and AA)
        run: pnpm run test:storybook

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This job runs the provided data server, so it needs its MongoDB binary.
      MONGOMS_DISABLE_POSTINSTALL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Playwright's webServer starts the whole stack (`pnpm dev`: data server, gateway, web).
      - name: E2E (Playwright + axe, desktop + mobile)
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
