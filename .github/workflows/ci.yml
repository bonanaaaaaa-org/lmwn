name: CI

# Every pull request (whatever its base branch, so stacked PRs are checked), every push to main,
# or by hand (Actions -> CI -> Run workflow). Runs on GitHub-hosted runners.
#
# Pull requests and manual runs: checks only, with no secrets and no cloud access (Verify, E2E,
# Infrastructure checks). The pr GCP project isn't billed, so nothing deploys from a pull request.
# A push to main also runs Deploy prod (environment: prod), which deploys infra/ to GCP
# (infra/README.md). Cloud access is only through workload identity federation; no cloud key is
# stored in GitHub.
#
# Every run ends with Allure report, which combines the test results, with the test history it
# reads back from the shared report host, and uploads them there (README, Test reports). Its
# GitHub OIDC token can only read and write this repository's test reports.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Terraform for infra/: the version CI and the deploy use.
  TERRAFORM_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Turborepo: no anonymous usage telemetry from CI.
  TURBO_TELEMETRY_DISABLED: "1"
  # The provided data server's MongoDB binary is only needed by `pnpm dev`, never by these checks.
  MONGOMS_DISABLE_POSTINSTALL: "1"

# A newer push to the same PR cancels the run it supersedes. A running run on main is never
# cancelled, so a deploy never stops half-way. GitHub keeps one pending run per group, so a queued
# main run can still be replaced by a newer push; Deploy prod also stops if main has moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: true
          persist-credentials: false
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6.1.1
      # Node version from .nvmrc; pnpm store cached, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # uv for the api-gateway; Python comes from .python-version (uv downloads it). uv's cache is
      # keyed on uv.lock.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Tool versions
        run: |
          node --version
          pnpm --version
          uv --version
          uv run python --version
      # Each check below is a root script run through Turborepo (turbo.json), per package
      # (api-gateway, web).
      - name: Format (ruff format)
        run: pnpm run format:check
      - name: Lint (oxlint, stylelint, Thai copy guard, ruff)
        run: pnpm run lint
      - name: Type check (tsc with typed CSS modules, pyrefly)
        run: pnpm run type-check
      - name: Test (Vitest with 90% coverage minimum; node:test for repo and web scripts; pytest with 90% coverage minimum and the architecture test)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Build Storybook
        run: pnpm run build-storybook
      # Story tests render every story in headless Chromium and fail on any axe violation
      # (Storybook a11y addon, `a11y.test: "error"`).
      - name: Install Playwright Chromium (story tests)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Storybook tests (play functions + axe, WCAG 2.2 A and AA)
        run: pnpm run test:storybook
      # For the Allure report job, from failed runs too. A suite that didn't run has no results.
      - name: Keep Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allure-results-verify
          path: |
            web/allure-results/
            api-gateway/allure-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This job runs the provided data server, so it needs its MongoDB binary.
      MONGOMS_DISABLE_POSTINSTALL: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Install Playwright Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Playwright's webServer starts the whole stack (`pnpm dev`: data server, gateway, web).
      - name: E2E (Playwright + axe, desktop + mobile)
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Keep Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allure-results-e2e
          path: e2e/allure-results/
          if-no-files-found: ignore
          retention-days: 7

  # One combined Allure report per run, uploaded to the shared report host (the provider repo's
  # allure-reports Worker) as pr-<number> for a pull request and as the branch name for a push.
  # The report carries the test history of earlier runs, read back from the host. Test jobs decide
  # pass or fail: this job runs after failed ones too, and a missing ALLURE_REPORTS_URL, an
  # unreachable host or missing history only warns.
  allure-report:
    name: Allure report
    needs: [verify, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The upload authenticates with this run's GitHub OIDC token; no secret is involved.
    permissions:
      contents: read
      id-token: write
    env:
      # The report's name on the host: pr-<number> for a pull request, else the branch.
      REPORT: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Only the root package, which holds the Allure CLI (its config is allurerc.mjs).
      # Like generating and uploading, a failure here only warns (Report failed).
      - name: Install the Allure CLI
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --filter .
      - uses: actions/download-artifact@v8.0.2
        id: download
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-artifacts
      # Test history (trends, each test's earlier runs, flaky / new / regressed marks): each report
      # carries its history/history.jsonl, and this reads the previous one back from the report host
      # (the provider repo's README, Test history and flaky tests) into allurerc.mjs's historyPath.
      # This report's own name first, then the base branch's (main for a push), so a pull request's
      # history starts from main's. No history, or a host that can't serve it, only means a report
      # without history.
      - name: Fetch the test history
        if: ${{ steps.install.outcome == 'success' && steps.download.outcome == 'success' && vars.ALLURE_REPORTS_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          ALLURE_REPORTS_URL: ${{ vars.ALLURE_REPORTS_URL }}
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          slug() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100; }
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ALLURE_REPORTS_URL" | jq -r .value)
          base="$ALLURE_REPORTS_URL/api/reports/${GITHUB_REPOSITORY#*/}"
          for report in "$(slug "$REPORT")" "$(slug "$BASE")"; do
            if curl -sSf --create-dirs -H "Authorization: Bearer $token" \
              "$base/$report/history/history.jsonl" -o allure-history/history.jsonl; then
              echo "Test history from the $report report ($(wc -l <allure-history/history.jsonl) runs)."
              exit 0
            fi
          done
          rm -f allure-history/history.jsonl
          echo "No test history yet: this report starts it."
      # Every directory holding results, wherever an artifact put it. Single-file report
      # (allurerc.mjs), so the upload is a few requests. Generating appends this run to the history
      # (and starts one when there was none).
      - name: Generate the report
        id: generate
        if: ${{ steps.install.outcome == 'success' && steps.download.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find allure-artifacts -name '*-result.json' -printf '%h\n' 2>/dev/null | sort -u)
          if ((${#dirs[@]} == 0)); then
            echo "::warning title=No Allure results::No test suite produced results, so there is no report."
            echo "No Allure report: no test suite produced results." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'Results: %s\n' "${dirs[@]}"
          pnpm exec allure generate --clean "${dirs[@]}"
          # The updated history goes up with the report, for the next run to fetch.
          if [[ -f allure-history/history.jsonl ]]; then
            mkdir -p allure-report/history
            cp allure-history/history.jsonl allure-report/history/
          fi
          echo "generated=true" >>"$GITHUB_OUTPUT"
      - name: No report host
        if: ${{ steps.generate.outputs.generated == 'true' && vars.ALLURE_REPORTS_URL == '' }}
        run: |
          echo "::warning title=Allure report not uploaded::ALLURE_REPORTS_URL is not set for this repository (provider repo, allure.enabled)."
          echo "Allure report not uploaded: \`ALLURE_REPORTS_URL\` is not set." >>"$GITHUB_STEP_SUMMARY"
      # The upload step from the provider repo's README (Allure reports). The token request fails on
      # a fork's pull request, which gets no id-token permission; that only warns, like a host
      # that is down.
      - name: Upload Allure report
        id: upload
        if: ${{ steps.generate.outputs.generated == 'true' && vars.ALLURE_REPORTS_URL != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          ALLURE_REPORTS_URL: ${{ vars.ALLURE_REPORTS_URL }}
        working-directory: allure-report
        run: |
          set -euo pipefail
          report=$(printf '%s' "$REPORT" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100)
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ALLURE_REPORTS_URL" | jq -r .value)
          base="$ALLURE_REPORTS_URL/api/reports/${GITHUB_REPOSITORY#*/}/$report"
          curl -sSf -X DELETE -H "Authorization: Bearer $token" "$base" >/dev/null
          # index.html last: it is what adds the report to the listing.
          find . -type f ! -path ./index.html -printf '%P\0' |
            xargs -0 -P 8 -I{} curl -sSf -T {} -H "Authorization: Bearer $token" "$base/{}" -o /dev/null
          curl -sSf -T index.html -H "Authorization: Bearer $token" "$base/index.html" -o /dev/null
          echo "Allure report: $ALLURE_REPORTS_URL/${GITHUB_REPOSITORY#*/}/$report/" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failed
        if: ${{ steps.install.outcome == 'failure' || steps.download.outcome == 'failure' || steps.generate.outcome == 'failure' || steps.upload.outcome == 'failure' }}
        run: |
          echo "::warning title=Allure report not published::Preparing, generating or uploading the report failed (see the steps above). Test results are unaffected."
          echo "Allure report not published: preparing or generating it failed, the report host could not be reached or refused the upload, or the run had no OIDC token (a fork's pull request)." >>"$GITHUB_STEP_SUMMARY"

  infra-check:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      # No backend and no credentials: validates the configuration and runs infra/tests with mock
      # providers (what prod plans).
      - name: terraform validate and test
        run: |
          terraform -chdir=infra init -backend=false -no-color
          terraform -chdir=infra validate -no-color
          terraform -chdir=infra test -no-color
      # shellcheck comes with the GitHub-hosted Ubuntu image.
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh

  deploy-prod:
    name: Deploy prod
    needs: [verify, e2e, infra-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only main may use prod's deploy identity and secrets (the provider repo's deployment branch policy).
    environment:
      name: prod
      url: ${{ steps.urls.outputs.web_url }}
    # Deploys one at a time, never cancelled half-way.
    concurrency:
      group: prod-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      # API quota and billing go to the prod project, not to the management project that holds the
      # deploy identity: gcloud, the Firebase CLI and the Google client libraries.
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_BILLING_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_WORKSPACE_PREFIX: ${{ vars.TF_STATE_WORKSPACE_PREFIX }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      # This commit's images (scripts/build-images.sh pushes them; Terraform runs them).
      TF_VAR_gateway_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lmwn/api-gateway:${{ github.sha }}
      TF_VAR_data_server_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lmwn/data-server:${{ github.sha }}
    steps:
      # A run that waited in the concurrency group, or a re-run, must not roll an older commit over
      # a newer one.
      - name: Check that main is still at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::error title=Stale deploy stopped::main is at $head, not $GITHUB_SHA. Nothing was changed; the newer commit's run deploys it."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # Installs and the web build run before any credential exists in the job. The API domain
      # is the one in infra/env/prod.tfvars (deploy-hosting.sh checks the bundle against
      # Terraform's api_url output).
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (post-deploy tests)
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Build the web app against the API domain
        run: |
          set -euo pipefail
          api_domain=$(sed -n 's/^api_domain *= *"\(.*\)"$/\1/p' infra/env/prod.tfvars)
          [[ -n $api_domain ]] || { echo "::error::no api_domain in infra/env/prod.tfvars"; exit 1; }
          VITE_API_BASE_URL="https://$api_domain" pnpm turbo run build --filter=web
      # Stories use fixtures only: built without VITE_API_BASE_URL (deploy-hosting.sh checks that the
      # bundle never names the API domain).
      - name: Build the Storybook
        run: pnpm turbo run build-storybook --filter=web
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: google-github-actions/auth@v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      # Only the Terraform steps hold the R2 key pair (state) and the Cloudflare token (DNS records
      # of bonanaaaaaa.dev only).
      - name: Initialize Terraform against the R2 state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: infra/scripts/backend-init.sh infra
      - name: Make sure the image registry exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: infra/scripts/ensure-registry.sh infra env/prod.tfvars
      - name: Build and push the images
        run: infra/scripts/build-images.sh
      # Plans prod (the changes go to the job summary) and applies that saved plan.
      - name: terraform plan and apply (prod)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: infra/scripts/apply.sh infra env/prod.tfvars
      - name: Public URLs
        id: urls
        run: echo "web_url=$WEB_URL" >>"$GITHUB_OUTPUT"
      - name: Deploy the web app and the Storybook to Firebase Hosting
        run: infra/scripts/deploy-hosting.sh
      # The checks below need no cloud access: drop the credentials file before running them.
      - name: Remove the Google credentials
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS" gha-creds-*.json
      # Until Google reports the Storybook domain active with its certificate (minutes to hours after
      # its first deploy), the checks use the Storybook's web.app URL, which serves the same release,
      # and the job warns. A domain still not ready a day after it was created fails the job. Once
      # it is ready, the domain itself is checked.
      - name: Storybook URL to check
        run: |
          set -euo pipefail
          if [[ -z $STORYBOOK_URL || -z $STORYBOOK_HOSTING_URL ]]; then
            echo "::error title=Storybook URL missing::Terraform's storybook_url or storybook_hosting_url output is empty."
            exit 1
          fi
          if [[ $STORYBOOK_DOMAIN_READY == true || $STORYBOOK_URL == "$STORYBOOK_HOSTING_URL" ]]; then
            echo "STORYBOOK_CHECK_URL=$STORYBOOK_URL" >>"$GITHUB_ENV"
            exit 0
          fi
          created=$(date -d "${STORYBOOK_DOMAIN_CREATED:-now}" +%s)
          if (($(date +%s) - created > 24 * 3600)); then
            echo "::error title=Storybook domain not serving::$STORYBOOK_URL was created at $STORYBOOK_DOMAIN_CREATED and Hosting still reports no active certificate. Check its DNS records (infra/README.md, Custom domains)."
            exit 1
          fi
          echo "::warning title=Storybook domain pending::$STORYBOOK_URL has no active certificate yet; checking $STORYBOOK_HOSTING_URL instead."
          echo "STORYBOOK_CHECK_URL=$STORYBOOK_HOSTING_URL" >>"$GITHUB_ENV"
      - name: Smoke-test the deploy
        run: infra/scripts/smoke-test.sh "$API_URL" "$WEB_URL" "$STORYBOOK_CHECK_URL"
      # Includes specs/storybook.spec.ts: every story renders with no request off the Storybook's origin.
      - name: E2E against the deployed site and Storybook (Playwright + axe, desktop + mobile)
        run: PLAYWRIGHT_BASE_URL="$WEB_URL" API_BASE_URL="$API_URL" STORYBOOK_URL="$STORYBOOK_CHECK_URL" pnpm --filter e2e test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-prod
          path: e2e/playwright-report/
          retention-days: 7
